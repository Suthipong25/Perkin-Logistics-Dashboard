<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perkin Logistics — ระบบบริหารจัดการใบงาน &amp; ศุลกากร</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
THESIS: Perkin Logistics Control Deck replaces disconnected manual spreadsheets with a unified, ledger-grade logistics command deck where every FWD upload updates Excel via Graph API and PostgreSQL in lockstep. Refuses floating glass cards and dark-neon tropes in favor of architectural gridlines, warm Perkin cream paper (#f7f5ef), deep Perkin navy (#071a2f), and signature Perkin signal orange (#f56a22).
OWN-WORLD: Perkin Navy (#071a2f / #0c2948) navigation rail paired with Perkin warm cream paper (#f7f5ef) and crisp white ledger sheets (#ffffff) separated by 1px hairline borders (#dce1e5), Perkin signal orange (#f56a22) accents, IBM Plex Sans Thai looped typography (14.5px), Manrope display type, and IBM Plex Mono tabular numerals.
STORY: Operations, CS, and Accounting teams at Perkin Logistics (Thailand) Co., Ltd. see real-time shipment health, bottleneck milestones, transport dispatches, and shipping advances, and can upload FWD files or edit job milestones with guaranteed Excel + Web consistency.
FIRST VIEWPORT: Left 248px Perkin Navy command rail with skewed orange P mark and official Perkin Logistics logo; 72px sticky header with global search (⌘K), live Excel sync badge, and FWD Upload CTA; 4-column hairline KPI strip (989 total jobs, 90.1% completion, 88 active, overdue alerts) above a 12-column grid of service mix bars, ETD monthly trend SVG, actionable overdue exceptions table, status ledger, and top customers.
FORM: Maritime Freight Manifest & Port Control Ledger (#1 grounded world).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div class="loading" id="loading"><i></i></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-jobs" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/><path d="M2 8h18"/><path d="M16 14h4"/></symbol>
      <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12"/><path d="m18 6-12 12"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18z"/><path d="M12 10v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m13 7 4 4"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 5v6h-6"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div class="brand-text">
          <span class="brand-name">PERKIN</span>
          <span class="brand-sub">LOGISTICS · THAILAND</span>
        </div>
      </div>

      <div class="nav-label">Operations</div>
      <nav class="nav" aria-label="เมนูหลัก">
        <button class="nav-item active" data-page="overview">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-dash"/></svg>
          ภาพรวมงาน
          <span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-page="jobs">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-jobs"/></svg>
          งานทั้งหมด
          <span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-page="transport">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-truck"/></svg>
          ขนส่ง
          <span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-page="advances">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-wallet"/></svg>
          เบิกเงิน / Clearing
          <span class="nav-dot"></span>
        </button>
      </nav>

      <div class="nav-label">System</div>
      <nav class="nav" aria-label="เมนูระบบ">
        <button class="nav-item" data-page="health">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-db"/></svg>
          คุณภาพข้อมูล
          <span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-page="upload">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-upload"/></svg>
          อัปโหลด FWD
          <span class="nav-dot"></span>
        </button>
        <button class="nav-item" data-page="settings">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-settings"/></svg>
          ตั้งค่า
          <span class="nav-dot"></span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="sync-line"><span class="sync-dot"></span><span>EXCEL SYNC · 10:32</span></div>
        <div class="pipeline">FWD → EXCEL → WEB</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="เปิดเมนู">
          <svg width="20" height="20"><use href="#i-menu"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">ภาพรวมงาน</h1>
          <p id="pageSub">ศูนย์ควบคุมสถานะงาน · 28 ต.ค. 2026</p>
        </div>
        <div class="search">
          <svg width="15" height="15"><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="ค้นหา Job No, ลูกค้า, B/L…" aria-label="ค้นหางาน">
          <kbd>⌘K</kbd>
        </div>
        <div class="top-actions">
          <div class="sync-chip"><span class="dot"></span> Excel ตรงกัน · 10:32</div>
          <button class="btn btn-primary" id="uploadBtn">
            <svg width="15" height="15"><use href="#i-upload"/></svg>
            อัปโหลด FWD
          </button>
          <div class="avatar" title="ผู้ใช้: Ops">OP</div>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"><span class="t-dot"></span><span id="toastText"></span></div>

  <script src="app.js"></script>
</body>
</html>
