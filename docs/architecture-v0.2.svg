  <!-- Step legend -->
  <text x="40" y="664" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11" fill="#475569">1 Export  ·  2 Webhook  ·  3 Upsert read model  ·  4 อ่าน  ·  5 HTTPS  ·  6 Payload  ·  7 Update Excel  ·  8 Sync กลับ  ·  9 แก้มือใน Excel  ·  10 Upload</text>
  <text x="40" y="694" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#475569">Excel = master   ·   PostgreSQL = read model   ·   เว็บอ่าน DB เท่านั้น   ·   n8n อัปเดต Excel ด้วย xlsx-populate (download → edit → upload)</text>
