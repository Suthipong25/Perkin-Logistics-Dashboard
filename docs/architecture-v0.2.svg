  <text x="355" y="201" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#0C4A6E">/FWD_Raw (ไฟล์ดิบ)</text>
  <text x="355" y="219" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#0C4A6E">/Queue (payload)</text>

