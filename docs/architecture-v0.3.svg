  <line x1="212" y1="190" x2="246" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="229" cy="190" r="11" fill="#0F172A"/>
  <text x="229" y="194" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>

  <line x1="462" y1="190" x2="496" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="479" cy="190" r="11" fill="#0F172A"/>
  <text x="479" y="194" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>

  <line x1="692" y1="190" x2="726" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="709" cy="190" r="11" fill="#0F172A"/>
  <text x="709" y="194" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>

  <line x1="932" y1="190" x2="966" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="949" cy="190" r="11" fill="#0F172A"/>
  <text x="949" y="194" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">4</text>

  <!-- Vertical main flow -->
  <line x1="1065" y1="242" x2="1065" y2="366" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1065" cy="304" r="11" fill="#0F172A"/>
  <text x="1065" y="308" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">5</text>

  <line x1="595" y1="242" x2="595" y2="366" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="595" cy="304" r="11" fill="#0F172A"/>
  <text x="595" y="308" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">6</text>

  <!-- Writer -> Storage -->
  <line x1="692" y1="420" x2="726" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="709" cy="420" r="11" fill="#0F172A"/>
  <text x="709" y="424" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#fff">7</text>

  <!-- n8n -> Storage raw -->
  <path d="M680 242 C 720 300, 760 330, 790 366" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dash)"/>
  <circle cx="735" cy="305" r="10" fill="#64748B"/>
  <text x="735" y="309" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#fff">8</text>

  <!-- Storage -> Next.js download -->
  <path d="M950 370 C 990 340, 1020 300, 1050 246" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dash)"/>
  <circle cx="1000" cy="310" r="10" fill="#64748B"/>
  <text x="1000" y="314" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#fff">9</text>

  <!-- Footer -->
  <rect x="40" y="580" width="1200" height="58" rx="14" fill="#0F172A"/>
  <text x="64" y="605" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11" font-weight="700" fill="#93C5FD" letter-spacing="1.2">SECURITY</text>
  <text x="64" y="625" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="12.5" fill="#E2E8F0">Local login + role   ·   Upload validation   ·   Graph Excel API (delegated)   ·   Audit Log   ·   PDPA minimization</text>

  <!-- Legend -->
  <text x="40" y="664" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11" fill="#475569">1 Upload  ·  2 Trigger  ·  3 Read model  ·  4 Read  ·  5 HTTPS  ·  6 Write Excel  ·  7 Update Excel  ·  8 Store raw  ·  9 Download Excel</text>
  <text x="40" y="694" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#475569">Excel = ไฟล์ใน OneDrive; อัปเดตเฉพาะ range   ·   PostgreSQL = read model   ·   ไม่มี SharePoint / Teams / Power Automate</text>
