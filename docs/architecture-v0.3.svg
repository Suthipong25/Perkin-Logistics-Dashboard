    <rect x="250" y="140" width="210" height="100" rx="14" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
  </g>
  <text x="355" y="178" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="17" font-weight="700" fill="#312E81">เว็บ /upload</text>
  <text x="355" y="201" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#312E81">ops / admin</text>
