  <text x="1065" y="178" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="16" font-weight="700" fill="#0F172A">Next.js Dashboard</text>
  <text x="1065" y="201" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#334155">อ่าน DB · login ภายใน</text>
  <text x="1065" y="219" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#334155">ดาวน์โหลด Excel</text>

