  <text x="595" y="427" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#7C2D12">service account</text>
  <text x="595" y="445" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#7C2D12">PATCH range · ไม่แทนไฟล์</text>

