<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="สถาปัตยกรรม v0.3 Web-only">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748B"/>
    </marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="#F8FAFC"/>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <text x="48" y="56" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="27" font-weight="700" fill="#0F172A">สถาปัตยกรรม v0.3.1 — Web-only (ไม่ใช้ SharePoint)</text>
  <text x="48" y="84" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="14" fill="#64748B">FWD  →  เว็บ /upload  →  n8n  →  Excel (Graph API) + PostgreSQL  →  Dashboard</text>

  <!-- web edit path -->
  <path d="M1065 138 L1065 112 L595 112 L595 138" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dash)"/>
  <text x="830" y="104" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11" fill="#475569">แก้ไขผ่านเว็บ → n8n → Excel + DB</text>
  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="170" height="100" rx="14" fill="#EEF2F7" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="125" y="178" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="17" font-weight="700" fill="#0F172A">FWD (ERP)</text>
  <text x="125" y="201" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#475569">ระบบต้นทาง</text>
  <text x="125" y="219" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#475569">Booking List Report</text>

