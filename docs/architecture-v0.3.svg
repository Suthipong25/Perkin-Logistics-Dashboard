  <text x="840" y="427" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#14532D">JOB_Daily (master)</text>
  <text x="840" y="445" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#14532D">raw files ในแอป</text>

