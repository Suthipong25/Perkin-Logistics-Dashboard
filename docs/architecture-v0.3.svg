  <text x="1075" y="427" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#064E3B">Ops · CS</text>
  <text x="1075" y="445" text-anchor="middle" font-family="'Leelawadee UI','Segoe UI',Tahoma,sans-serif" font-size="11.5" fill="#064E3B">Management</text>

